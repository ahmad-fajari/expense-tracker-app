<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Expense Tracker App | Ahmad Fajari</title>
  <meta name="author"
    content="Force Close">
  <meta name="description"
    content="">
  <meta name="keywords"
    content="Force Close, ">

  <!-- OG Tags -->
  <meta property="og:title"
    content="">
  <meta property="og:description"
    content="">
  <meta property="og:image"
    content=""> <!-- isi image -->
  <meta property="og:url"
    content=""> <!-- isi live site url -->
  <meta property="og:type"
    content="website">
  <meta property="og:site_name"
    content="Force Close Portfolio">

  <!-- Twitter Card Tags -->
  <meta name="twitter:card"
    content="summary_large_image">
  <meta name="twitter:title"
    content="">
  <meta name="twitter:description"
    content="">
  <meta name="twitter:image"
    content=""> <!-- isi image -->
  <meta name="twitter:url"
    content=""> <!-- isi live site url -->

  <!-- favicon -->
  <link rel="icon"
    href="./src/assets/account_balance_wallet.svg"
    type="image/svg+xml">

  <!-- font -->
  <link rel="preconnect"
    href="https://fonts.googleapis.com">
  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">

  <!-- stylesheet -->
  <link rel="stylesheet"
    href="./src/css/style.css">

  <!-- javascript -->
  <script src="./src/js/main.js"
    defer></script>
</head>

<body>

  <!-- TRACKER APP -->
  <div class="tracker-app">

    <!-- TRACKER HEADER -->
    <header class="tracker-header">
      <div class="tracker-header__wrapper">
        <h1 class="tracker-header__title">Tracker<span>.io</span></h1>
        <div class="tracker-header__user">
          <div class="tracker-header__user-info">
            <span class="tracker-header__greeting">Halo, <strong>Ahmad Fajari</strong></span>
            <span>(ahmad_fajari)</span>
            <span class="tracker-header__date">Bulan Ini</span>
          </div>
          <div class="tracker-header__avatar">
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640">
              <path d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z" />
            </svg>
          </div>
        </div>
      </div>
    </header>

    <!-- TRACKER MAIN -->
    <main class="tracker-main">

      <!-- TRACKER SUMMARY -->
      <section class="tracker-main__summary tracker-summary"
        aria-labelledby="summary-heading">
        <h2 id="summary-heading"
          class="visually-hidden">Ringkasan Keuangan</h2>

        <!-- balance -->
        <div class="tracker-summary__balance tracker-card">
          <h3 class="tracker-summary__label tracker-summary__label--balance">
            <svg class="primary"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960">
              <path d="M71.87-111.87v-91H434.5V-645.8q-25.04-9.48-43.33-27.88-18.28-18.41-27.76-43.45H245.74l117.13 273.54q0 52.69-42.58 89.58-42.59 36.88-102.83 36.88-60.24 0-102.92-36.88-42.67-36.89-42.67-89.58l117.37-273.54h-77.37v-91h251.54q13.2-35.48 44.94-57.74 31.74-22.26 71.67-22.26 39.94 0 71.65 22.26 31.72 22.26 44.92 57.74h251.54v91h-77.37l117.37 273.54q0 52.69-42.58 89.58-42.59 36.88-102.83 36.88-60.24 0-102.92-36.88-42.67-36.89-42.67-89.58l117.13-273.54H596.59q-9.48 25.04-27.76 43.45-18.29 18.4-43.33 27.88v442.93h362.63v91H71.87Zm599.35-334.35h142.82l-71.41-165.63-71.41 165.63Zm-525.02 0h142.82l-71.65-165.63-71.17 165.63ZM480.07-724.3q16.21 0 27.11-11.15 10.91-11.14 10.91-27.28 0-16.15-10.92-27.07-10.93-10.92-27.07-10.92t-27.17 10.92q-11.02 10.92-11.02 27.07 0 16.14 10.97 27.28 10.97 11.15 27.19 11.15Z" />
            </svg>
            Saldo Saat Ini
          </h3>
          <p id="balance-amount"
            class="tracker-summary__balance-amount primary"></p>
        </div>

        <!-- income -->
        <div class="tracker-summary__stat tracker-summary__stat--income tracker-card">
          <h3 class="tracker-summary__label">
            <svg class="income"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960">
              <path d="M192.59-192.11v-411h91v256.35l460.89-460.89L808.13-744 347.24-283.11h256.35v91h-411Z" />
            </svg>
            Pemasukan
          </h3>
          <p id="income-amount"
            class="tracker-summary__stat-amount income"></p>
        </div>

        <!-- expense -->
        <div class="tracker-summary__stat tracker-summary__stat--expense tracker-card">
          <h3 class="tracker-summary__label">
            <svg class="expense"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960">
              <path d="M258.39-232.11 194.5-296 573-674.5H236.89v-91h491v491h-91v-336.11l-378.5 378.5Z" />
            </svg>
            Pengeluaran
          </h3>
          <p id="expense-amount"
            class="tracker-summary__stat-amount expense"></p>
        </div>
      </section>

      <!-- TRACKER FORM SECTION -->
      <section class="tracker-main__form-section tracker-form-section"
        aria-labelledby="form-heading">
        <h2 id="form-heading"
          class="tracker-form-section__heading">Tambah Pencatatan Baru</h2>

        <!-- TRACKER TRANSACTION FORM -->
        <form id="transactionForm"
          data-testid="transactionForm"
          class="tracker-transaction-form"
          novalidate>

          <!-- keterangan -->
          <div class="tracker-transaction-form__field">
            <label class="tracker-transaction-form__label"
              for="transactionFormTitleInput">Keterangan</label>
            <input type="text"
              name="title"
              id="transactionFormTitleInput"
              data-testid="transactionFormTitleInput"
              class="tracker-transaction-form__input tracker-input"
              placeholder="Misal: Makan siang..."
              required
              data-error-value="Keterangan wajib diisi">
          </div>

          <!-- nominal -->
          <div class="tracker-transaction-form__field">
            <label class="tracker-transaction-form__label"
              for="transactionFormAmountInput">Nominal (Rp)</label>
            <input type="number"
              name="amount"
              id="transactionFormAmountInput"
              data-testid="transactionFormAmountInput"
              class="tracker-transaction-form__input tracker-input"
              placeholder="50000"
              min="1"
              required
              data-error-value="Nominal wajib diisi"
              data-error-min="Nominal tidak boleh kurang dari Rp. 1">
          </div>

          <!-- tanggal -->
          <div class="tracker-transaction-form__field">
            <label class="tracker-transaction-form__label"
              for="transactionFormDateInput">Tanggal</label>
            <input type="date"
              name="date"
              id="transactionFormDateInput"
              data-testid="transactionFormDateInput"
              class="tracker-transaction-form__input tracker-input"
              required
              data-error-value="Tanggal wajib diisi"
              data-error-max="Tanggal tidak boleh lebih dari hari ini">
          </div>

          <!-- Klasifikasi -->
          <div class="tracker-transaction-form__field">
            <label class="tracker-transaction-form__label"
              for="transactionFormTypeSelect">Klasifikasi</label>
            <select name="type"
              id="transactionFormTypeSelect"
              data-testid="transactionFormTypeSelect"
              class="tracker-transaction-form__input tracker-input"
              required
              data-error-value="Klasifikasi transaksi wajib dipilih">
              <option value=""
                disabled
                selected
                hidden>Pilih klasifikasi transaksi</option>
              <option value="income">
                <span class="option-icon income"
                  aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640">
                    <path d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z" />
                  </svg>
                </span>
                <span class="option-label">Uang Masuk</span>
              </option>
              <option value="expense">
                <span class="option-icon expense"
                  aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640">
                    <path d="M96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320z" />
                  </svg>
                </span>
                <span class="option-label">Uang Keluar</span>
              </option>
            </select>
          </div>

          <!-- simpan button -->
          <button type="submit"
            data-testid="transactionFormSubmitButton"
            class="tracker-transaction-form__submit">Catat Transaksi</button>
        </form>

      </section>

      <!-- TRACKER HISTORY -->
      <section class="tracker-history"
        aria-labelledby="history-heading">
        <h2 id="history-heading"
          class="visually-hidden">Riwayat Transaksi</h2>

        <!-- TRACKER SEARCH -->
        <form id="searchTransactionForm"
          data-testid="searchTransactionForm"
          class="tracker-search"
          role="search"
          novalidate>
          <div class="tracker-search__input-wrapper">
            <input type="search"
              id="searchTransactionFormTitleInput"
              data-testid="searchTransactionFormTitleInput"
              class="tracker-search__input tracker-input"
              placeholder="Cari transaksi berdasarkan judul..."
              required
              aria-label="Kata kunci pencarian transaksi">
            <button type="button"
              id="clear-button"
              class="tracker-search__input-clear"
              aria-label="Bersihkan pencarian"
              title="Bersihkan pencarian">
              <svg aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 640">
                <path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z" />
              </svg>
            </button>
          </div>
          <button type="submit"
            data-testid="searchTransactionFormSubmitButton"
            class="tracker-search__submit"
            aria-label="Mulai Pencarian"
            title="Mulai pencarian">
            <svg aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640">
              <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
            </svg>
          </button>
        </form>

        <!-- TRACKER TRANSACTION LIST -->
        <div id="transaction-list"
          class="tracker-transaction-list">

          <!-- income -->
          <div class="tracker-transaction-list__card tracker-card">
            <div class="tracker-transaction-list__header">
              <h3 class="tracker-transaction-list__title">Arus Pemasukan</h3>
            </div>
            <!-- Jangan ubah atau hapus atribut data-testid pada elemen berikut -->
            <div id="incomeList"
              data-testid="incomeList"
              class="tracker-transaction-list__container">
              <!-- Kartu transaksi pemasukan akan disisipkan di sini oleh JavaScript -->
            </div>
          </div>

          <!-- expense -->
          <div class="tracker-transaction-list__card tracker-card">
            <div class="tracker-transaction-list__header">
              <h3 class="tracker-transaction-list__title">Arus Pengeluaran</h3>
            </div>
            <!-- Jangan ubah atau hapus atribut data-testid pada elemen berikut -->
            <div id="expenseList"
              data-testid="expenseList"
              class="tracker-transaction-list__container">
              <!-- Kartu transaksi pengeluaran akan disisipkan di sini oleh JavaScript -->
            </div>
          </div>

        </div>

      </section>

    </main>

    <!-- footer -->
    <footer class="tracker-footer">
      <p>Tracker.io.</p>
      <p>&#169; 2026 Ahmad Fajari all rights reserved.</p>
      <p>Dicoding Front-End Web Project Submission.</p>
    </footer>

  </div>

  <!-- template -->
  <template id="transaction-template">
    <section data-testid="transactionItem"
      class="tracker-transaction-item">

      <!-- detail transaksi wrapper -->
      <div class="tracker-transaction-item__detail">
        <!-- judul / keterangan -->
        <h3 data-testid="transactionItemTitle"
          class="tracker-transaction-item__title"></h3>
        <!-- nominal -->
        <span data-testid="transactionItemAmount"
          class="tracker-transaction-item__amount"></span>
        <!-- tanggal -->
        <span data-testid="transactionItemDate"
          class="tracker-transaction-item__date"></span>
        <!-- klasifikasi -->
        <span data-testid="transactionItemType"
          class="visually-hidden"></span>
      </div>

      <!-- button wrapper -->
      <div class="tracker-transaction-item__actions">

        <!-- edit button -->
        <button type="button"
          id="edit-button"
          class="tracker-transaction-item__btn action-button"
          aria-label="Edit Transaksi"
          title="Edit Transaksi">
          <svg aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640">
            <path d="M535.6 85.7C513.7 63.8 478.3 63.8 456.4 85.7L432 110.1L529.9 208L554.3 183.6C576.2 161.7 576.2 126.3 554.3 104.4L535.6 85.7zM236.4 305.7C230.3 311.8 225.6 319.3 222.9 327.6L193.3 416.4C190.4 425 192.7 434.5 199.1 441C205.5 447.5 215 449.7 223.7 446.8L312.5 417.2C320.7 414.5 328.2 409.8 334.4 403.7L496 241.9L398.1 144L236.4 305.7zM160 128C107 128 64 171 64 224L64 480C64 533 107 576 160 576L416 576C469 576 512 533 512 480L512 384C512 366.3 497.7 352 480 352C462.3 352 448 366.3 448 384L448 480C448 497.7 433.7 512 416 512L160 512C142.3 512 128 497.7 128 480L128 224C128 206.3 142.3 192 160 192L256 192C273.7 192 288 177.7 288 160C288 142.3 273.7 128 256 128L160 128z" />
          </svg>
        </button>

        <!-- ubah transaksi button -->
        <button type="button"
          data-testid="transactionItemEditTypeButton"
          class="tracker-transaction-item__btn action-button"
          aria-label="Ubah Tipe Transaksi"
          title="Ubah Tipe Transaksi">
          <svg aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640">
            <path d="M566.6 214.6L470.6 310.6C458.1 323.1 437.8 323.1 425.3 310.6C412.8 298.1 412.8 277.8 425.3 265.3L466.7 224L96 224C78.3 224 64 209.7 64 192C64 174.3 78.3 160 96 160L466.7 160L425.3 118.6C412.8 106.1 412.8 85.8 425.3 73.3C437.8 60.8 458.1 60.8 470.6 73.3L566.6 169.3C579.1 181.8 579.1 202.1 566.6 214.6zM169.3 566.6L73.3 470.6C60.8 458.1 60.8 437.8 73.3 425.3L169.3 329.3C181.8 316.8 202.1 316.8 214.6 329.3C227.1 341.8 227.1 362.1 214.6 374.6L173.3 416L544 416C561.7 416 576 430.3 576 448C576 465.7 561.7 480 544 480L173.3 480L214.7 521.4C227.2 533.9 227.2 554.2 214.7 566.7C202.2 579.2 181.9 579.2 169.4 566.7z" />
          </svg>
        </button>

        <!-- hapus transaksi button -->
        <button type="button"
          data-testid="transactionItemDeleteButton"
          class="tracker-transaction-item__btn delete-button"
          aria-label="Hapus Transaksi"
          title="Hapus Transaksi">
          <svg aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640">
            <path d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z" />
          </svg>
        </button>
      </div>
    </section>
  </template>

</body>

</html>
